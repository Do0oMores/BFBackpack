      default: battlefield:mg42
    SECONDARY:
      allow-tags: [battlefield:pistol]
      default: battlefield:p38
    GADGET_1:
      allow-tags: [battlefield:gadget]
      default: battlefield:anti_tank
    GADGET_2:
      allow-tags: [battlefield:gadget]
      default: battlefield:dynamite
    GRENADE:
      allow-tags: [battlefield:grenade]
      default: battlefield:frag
    MELEE:
      allow-tags: [battlefield:melee]
      default: battlefield:knife
  RECON:
