# BFBackpack 2.0 —— 服务器权威配装后端
# 新系统的装备/附件/规则分别见 weapons.yml、attachments.yml、class-rules.yml。
# 下方 settings/backpacks 为保留的旧背包实现配置；2.0 默认不注册旧 GUI 和物品发放。
# 新系统采用每次修改事务确认后更新缓存，无需自动保存周期。
#
# 每个玩家固定拥有 ASSAULT / MEDIC / SUPPORT / RECON 四个背包，
# 数据以 (player_uuid, backpack_type) 作为主键存储，玩家之间、兵种之间互不影响。
# 背包内容存在数据库里而不是玩家身上，所以死亡不会掉落。

database:
  # sqlite: 零配置，文件落在 plugins/BFBackpack/<file>，适合单服
  # mysql : 多服共享存档时使用，表名统一带 table-prefix 前缀
  type: sqlite
  table-prefix: bf_

  sqlite:
    file: backpacks.db

  mysql:
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: root
    password: ""
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC"

# 运行时校验（第二阶段 TaCZ/Forge 资源验证）。
# 校验在独立的有界线程池执行，数据库工作线程永远不执行也不会等待校验逻辑。
runtime-validation:
  # 单次部署描述的整体校验预算；超时后明确返回 VALIDATION_TIMEOUT，资源保持未验证
  timeout-ms: 3000
  # 同时执行的校验数量，即线程池大小；过小会排队，过大会放大适配器阻塞的影响
  max-concurrent-validations: 8
  # 等待队列上限；队列满时立即返回 VALIDATION_BUSY，不会无限排队
  queue-capacity: 32

permissions:
  # 权限快照的最大有效时间（毫秒）。修改配装/部署时若快照已超过该时间，
  # 会返回 PERMISSION_STALE 而不是用过期权限授权；0 表示关闭该检查。
  max-snapshot-age-ms: 5000

settings:
  # 两次切换之间的最小间隔（毫秒），0 表示不限制
  switch-cooldown-ms: 500
  # 切换后是否自动打开新背包
  open-on-switch: true
  # 脏数据兜底落盘间隔（秒），0 表示关闭；正常关闭界面/切换/退出都会即时保存
  auto-save-seconds: 300
  # 是否按下面的 deny-materials 拦截物品放入
  restrict-items: true
  # 关闭界面时把非法物品、超容量物品退还玩家；false 则直接丢弃
  eject-illegal-items: true

# 四个兵种的功能定位与容量，均可自由调整
backpacks:
  ASSAULT:
    display: "突击"
    description: "正面突击与反载具，均衡的通用火力"
    icon: IRON_SWORD
    slots: 9
    deny-materials: [BOW, CROSSBOW]

  MEDIC:
    display: "医疗"
    description: "战场救护，续航优先，禁带爆炸物"
    icon: GOLDEN_APPLE
    slots: 9
    deny-materials: [BOW, CROSSBOW, TNT, TNT_MINECART, END_CRYSTAL, RESPAWN_ANCHOR, FIRE_CHARGE]

  SUPPORT:
    display: "支援"
    description: "火力压制与弹药补给，容量最大"
    icon: CHEST
    slots: 9
    deny-materials: [BOW, CROSSBOW, ELYTRA]

  RECON:
    display: "侦查"
    description: "远程侦察与精确狙杀，轻装机动"
    icon: SPYGLASS
    slots: 9
    deny-materials: [TNT, TNT_MINECART, END_CRYSTAL, RESPAWN_ANCHOR]
