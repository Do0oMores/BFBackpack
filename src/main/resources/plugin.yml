name: BFBackpack
version: '${project.version}'
main: top.mores.bFBackpack.BFBackpack
api-version: '1.20'
description: Battlefield 服务器权威配装后端，API v2
author: Mores
commands:
  bfbackpack:
    description: 军械库、解锁、四兵种配装和附件管理
    usage: /bfbackpack <catalog|unlock|loadout|weapon|settings>
    aliases: [bp, backpack]
permissions:
  bfbackpack.admin:
    description: 所有后端调试命令
    default: op
    children:
      bfbackpack.admin.catalog: true
      bfbackpack.admin.unlock: true
      bfbackpack.admin.loadout: true
      bfbackpack.admin.weapon: true
      bfbackpack.admin.settings: true
  bfbackpack.admin.catalog:
    description: 查询和重载目录
    default: op
  bfbackpack.admin.unlock:
    description: 管理永久解锁
    default: op
  bfbackpack.admin.loadout:
    description: 检查和修改兵种配装
    default: op
  bfbackpack.admin.weapon:
    description: 检查和修改附件
    default: op
  bfbackpack.admin.settings:
    description: 玩家默认兵种设置
    default: op
  bfbackpack.weapon.gewehr43:
    description: 临时授权 Gewehr 43（仍受兵种规则限制）
    default: false
  bfbackpack.attachment.scope_advanced:
    description: 临时授权高级瞄准镜
    default: false