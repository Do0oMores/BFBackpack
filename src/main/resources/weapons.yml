# ============================================================================
# BFBackpack 2.0 装备目录（第一阶段为开发占位数据）
# ----------------------------------------------------------------------------
# 所有 provider: BFEXAMPLE 与 gun-id: example:* 均为**开发占位资源**，只用于验证
# 目录、TAG、兵种规则、解锁与部署描述的数据流，不代表任何真实 TaCZ 枪械。
#
# 第二阶段替换步骤：
#   1. 把 provider 改为真实提供方（例如 TACZ）。
#   2. 把 gun-id 改为该提供方真实存在的资源 ID。
#   3. 在 Bukkit 桥接插件里注册 ValidationProvider（见 docs/API.md）。
# 只要 provider 仍为 BFEXAMPLE，真实 Adapter 必须返回 UNVERIFIED，
# 因此占位装备永远不会被标记为可部署。
#
# 内部 ID、provider 与 gun-id 分别标识目录条目、提供方和真实资源。
# TAG 必须先在此注册；大小写会规范化为小写。
# ============================================================================
tags:
  # 枪械
  - battlefield:assault_rifle
  - battlefield:semi_auto_rifle
  - battlefield:smg
  - battlefield:lmg
  - battlefield:bolt_action
  - battlefield:pistol
  # 装备分类：按兵种职责区分，不再四个兵种共用同一套反坦克/炸药
  - battlefield:gadget
  - battlefield:medical
  - battlefield:smoke
  - battlefield:supply
  - battlefield:repair
  - battlefield:recon
  - battlefield:beacon
  # 其他
  - battlefield:grenade
  - battlefield:melee

